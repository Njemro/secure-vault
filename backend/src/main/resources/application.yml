spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties]"
  application:
    name: secure-vault-backend
  datasource:
    # MySQL container from docker-compose.yml (host port 3307 -> container 3306).
    # Database name, username and password MUST come from environment variables;
    # Spring Boot does not read .env automatically (see README / task notes).
    # Automated tests override all datasource keys with in-memory H2 via the
    # "test" profile (src/test/resources/application-test.yml).
    url: jdbc:mysql://localhost:3307/${MYSQL_DATABASE}?sslMode=VERIFY_IDENTITY
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Set via env var KEYCLOAK_ISSUER_URI.
          # No realm/secret is hardcoded here. A blank default means no Keycloak
          # is configured and JWT validation fails closed (rejects every token).
          issuer-uri: ${KEYCLOAK_ISSUER_URI:}

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:}
  realm: ${KEYCLOAK_REALM:secure-vault}
  # Confidential client with Service Accounts enabled in the secure-vault realm.
  admin:
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:secure-vault-admin}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}

server:
  # The browser must enter through the Gateway (localhost:8000), never call
  # the resource server directly. Override only for a private container network.
  address: 127.0.0.1
  port: 8081
  ssl:
    enabled: true
    key-store: file:../certs/localhost.p12
    key-store-type: PKCS12
    key-store-password: ${BACKEND_SSL_PASSWORD}
    key-alias: localhost
