spring:
  config:
    import: "optional:file:../.env[.properties]"
  application:
    name: secure-vault-backend
  datasource:
    # MySQL container from docker-compose.yml (host port 3307 -> container 3306).
    # Database name, username and password MUST come from environment variables;
    # Spring Boot does not read .env automatically (see README / task notes).
    # Automated tests override all datasource keys with in-memory H2 via the
    # "test" profile (src/test/resources/application-test.yml).
    url: jdbc:mysql://localhost:3307/${MYSQL_DATABASE}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Set via env var KEYCLOAK_ISSUER_URI.
          # No realm/secret is hardcoded here. A blank default means no Keycloak
          # is configured and JWT validation fails closed (rejects every token).
          issuer-uri: ${KEYCLOAK_ISSUER_URI:}

keycloak:
  # Keycloak server base URL (e.g. http://localhost:8080). Used by the
  # registration endpoint to call Keycloak's admin REST API.
  server-url: ${KEYCLOAK_SERVER_URL:}
  # Realm in which users are created (must match KEYCLOAK_ISSUER_URI's realm).
  realm: ${KEYCLOAK_REALM:secure-vault}
  # Bootstrap administrator credentials for the admin-cli direct grant.
  # These are only used by the backend to provision Keycloak accounts during
  # registration; they are never exposed to the frontend.
  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME:}
    password: ${KEYCLOAK_ADMIN_PASSWORD:}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}

server:
  port: 8081
