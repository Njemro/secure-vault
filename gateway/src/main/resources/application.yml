spring:
  application:
    name: secure-vault-gateway

server:
  # Edge entry point on 8000 (Keycloak owns 8080). The backend stays on 8081.
  port: 8000

gateway:
  routes:
    api:
      # Backend base URL that /api/** is forwarded to.
      # Override per environment via the GATEWAY_API_URI environment variable.
      # No secret is stored here - this is a plain internal service URL.
      uri: ${GATEWAY_API_URI:http://localhost:8081}
