spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties]"
  application:
    name: secure-vault-gateway

  data:
    redis:
      # Redis holds the rate-limit counters for the gateway. In Compose the redis
      # service is published on loopback only (127.0.0.1:6379) so the host-run
      # gateway can reach it without exposing Redis beyond this machine.
      # Override per environment via GATEWAY_REDIS_HOST / GATEWAY_REDIS_PORT.
      host: ${GATEWAY_REDIS_HOST:localhost}
      port: ${GATEWAY_REDIS_PORT:6379}

  cloud:
    gateway:
      server:
        webflux:
          redis-rate-limiter:
            # Per-route limits, keyed by the route id ("api-backend").
            # ReplenishRate = tokens added per second; BurstCapacity = bucket size;
            # RequestedTokens = cost of one request. Defaults are deliberately
            # modest for local development and are overridden per environment via
            # the GATEWAY_RATE_LIMIT_* environment variables.
            config:
              api-backend:
                replenish-rate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:10}
                burst-capacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:20}
                requested-tokens: ${GATEWAY_RATE_LIMIT_REQUESTED_TOKENS:1}
              api-registration:
                replenish-rate: ${GATEWAY_REGISTER_RATE_LIMIT_REPLENISH_RATE:1}
                burst-capacity: ${GATEWAY_REGISTER_RATE_LIMIT_BURST_CAPACITY:5}
                requested-tokens: 1

server:
  # Edge entry point on 8000 (Keycloak owns 8080). The backend stays on 8081.
  port: 8000
  forward-headers-strategy: none

gateway:
  oidc:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/secure-vault}
    authorization-uri: ${KEYCLOAK_AUTHORIZATION_URI:http://localhost:8080/realms/secure-vault/protocol/openid-connect/auth}
    token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8080/realms/secure-vault/protocol/openid-connect/token}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/secure-vault/protocol/openid-connect/certs}
    user-info-uri: ${KEYCLOAK_USER_INFO_URI:http://localhost:8080/realms/secure-vault/protocol/openid-connect/userinfo}
  routes:
    api:
      # Backend base URL that /api/** is forwarded to.
      # Override per environment via the GATEWAY_API_URI environment variable.
      # No secret is stored here - this is a plain internal service URL.
      uri: ${GATEWAY_API_URI:http://localhost:8081}
