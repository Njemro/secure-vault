
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is not set}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is not set}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is not set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is not set}
    command:
      - --require-secure-transport=ON
      - --ssl-ca=/etc/mysql/certs/rootCA.pem
      - --ssl-cert=/etc/mysql/certs/local-services.pem
      - --ssl-key=/etc/mysql/certs/local-services-key.pem
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./certs/rootCA.pem:/etc/mysql/certs/rootCA.pem:ro
      - ./certs/local-services.pem:/etc/mysql/certs/local-services.pem:ro
      - ./certs/local-services-key.pem:/etc/mysql/certs/local-services-key.pem:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --ssl-mode=VERIFY_IDENTITY --ssl-ca=/etc/mysql/certs/rootCA.pem --silent
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /etc/redis/certs/local-services.pem
      - --tls-key-file
      - /etc/redis/certs/local-services-key.pem
      - --tls-ca-cert-file
      - /etc/redis/certs/rootCA.pem
      - --tls-auth-clients
      - "no"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./certs/rootCA.pem:/etc/redis/certs/rootCA.pem:ro
      - ./certs/local-services.pem:/etc/redis/certs/local-services.pem:ro
      - ./certs/local-services-key.pem:/etc/redis/certs/local-services-key.pem:ro
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --tls --cacert /etc/redis/certs/rootCA.pem -h 127.0.0.1 -p 6379 ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    restart: unless-stopped
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?KC_BOOTSTRAP_ADMIN_USERNAME is not set}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD is not set}
      KC_HEALTH_ENABLED: "true"

      KC_HTTP_ENABLED: "false"
      KC_HTTPS_PORT: 8443
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/localhost.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/localhost-key.pem
      KC_HOSTNAME: https://localhost:8080
    ports:
      - "127.0.0.1:8080:8443"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./certs/localhost.pem:/opt/keycloak/conf/localhost.pem:ro
      - ./certs/localhost-key.pem:/opt/keycloak/conf/localhost-key.pem:ro
    healthcheck:
      test:
        - CMD-SHELL
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql-data:
  keycloak-data:
